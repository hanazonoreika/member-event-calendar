<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#263b56">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
<title>【非公式】 統合イベントカレンダー</title>
<style>
:root{--bg:#f6f4f1;--card:#fff;--ink:#262626;--muted:#777;--line:#e8e4df;--navy:#263b56;--ticket:#e58b32}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
header{background:var(--navy);color:white;padding:20px max(15px,calc((100% - 1200px)/2))}
h1{font-size:clamp(1.2rem,3vw,1.7rem);margin:0 0 5px}
header p{margin:0;color:#dbe3ee;font-size:.9rem}
main{max-width:1200px;margin:18px auto;padding:0 12px 32px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.9fr);gap:14px}
.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:14px;min-width:0}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:7px;flex-wrap:wrap;margin-bottom:12px}
button,input,select,textarea{font:inherit}
button{border:1px solid #d8d4cf;background:white;border-radius:9px;padding:8px 11px;cursor:pointer}
button:hover{filter:brightness(.97)}
button:disabled{opacity:.5;cursor:wait}
button.primary{background:var(--navy);color:white;border-color:var(--navy)}
button.danger{color:#a72e2e}
.month{font-weight:750;font-size:1.2rem}
.weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calendar{display:flex;flex-direction:column;gap:4px}
.week-row{min-width:0}
.week-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.weekdays div{text-align:center;color:var(--muted);font-size:.76rem;padding:6px 0}
.day{min-width:0;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:4px;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.day.outside{background:#faf9f7;color:#aaa}
.day.today{border:2px solid var(--navy)}
.day.selected{box-shadow:inset 0 0 0 2px #d5a642}
.daynum{font-size:.8rem;font-weight:700}
.pill{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;font-size:.64rem;line-height:1.25;border-radius:4px;padding:3px;overflow:hidden;white-space:normal;overflow-wrap:anywhere;word-break:break-word;max-height:calc(1.25em * 2 + 6px)}
.legend{display:flex;flex-wrap:wrap;gap:7px 10px;font-size:.75rem;margin:12px 0}
.legend span{display:flex;align-items:center;gap:4px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.muted{font-size:.82rem;color:var(--muted);line-height:1.5}
.small{font-size:.72rem;color:var(--muted)}
.status{font-size:.78rem;line-height:1.6;background:#f4f1eb;padding:9px;border-radius:8px;overflow-wrap:anywhere}
.status.ok{background:#eaf6ec}
.status.warn{background:#fff2dc}
.cards{display:flex;flex-direction:column;gap:8px}
.event{border:1px solid var(--line);border-radius:10px;padding:10px}
.event h3{font-size:.9rem;margin:0 0 5px;overflow-wrap:anywhere}
.meta{font-size:.77rem;color:#666;line-height:1.6;overflow-wrap:anywhere}
.chip{display:inline-block;font-size:.7rem;border-radius:20px;padding:3px 7px;background:#f0eeeb;margin:5px 3px 0 0}
label{font-size:.8rem;font-weight:650;display:grid;gap:4px;margin-bottom:9px}
input,select,textarea{width:100%;border:1px solid #d8d4cf;border-radius:8px;padding:8px;background:white}
input[type=checkbox]{width:auto}
textarea{min-height:75px}
.formrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.actions button{font-size:.76rem;padding:6px 8px}
a{color:#245f9e;overflow-wrap:anywhere}
.map-link{font-weight:600}
.calendar-wrap{min-width:0}
.period-section{margin-top:10px}
.week-ticket-lane{min-width:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(23px,auto);gap:3px 4px;margin-top:3px}
.week-ticket-lane:empty{display:none}
.period-heading{font-size:.76rem;color:#8a5b27;margin:5px 0}
.period-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.period-lane{min-width:0;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));grid-auto-rows:minmax(23px,auto);gap:3px 4px}
.period-bar{grid-column:var(--start)/var(--end);grid-row:var(--lane);min-width:0;border:0;border-radius:5px;background:#f8dfc3;color:#744311;text-align:left;padding:4px 6px;font-size:.66rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.period-bar:hover{background:#f2c999}
.period-bar:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
.period-key{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;color:#744311;margin:7px 0}
.period-key i{display:inline-block;width:12px;height:8px;border-radius:3px;background:var(--ticket)}
#editor{grid-column:1/-1}
.hidden{display:none!important}
@media(max-width:740px){
 main{grid-template-columns:1fr}
 .day{min-height:65px;padding:3px}
 .pill{font-size:.56rem;padding:2px;max-height:calc(1.25em * 2 + 4px)}
 .panel{padding:11px}
 .period-bar{font-size:.56rem;padding:4px 3px}
 .weekdays,.week-days,.week-ticket-lane{gap:2px}
 .formrow{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
<h1>【非公式】 統合イベントカレンダー</h1>
<p>　公式予定・会場マップ・チケット受付期間</p>
</header>

<main>
<section class="panel calendar-wrap">
<div class="toolbar">
<div>
<button id="prev" type="button" aria-label="前の月">‹</button>
<button id="today" type="button">今月</button>
<button id="next" type="button" aria-label="次の月">›</button>
</div>
<div class="month" id="month"></div>
<button class="primary" id="add" type="button">＋ 予定追加</button>
</div>

<div class="weekdays">
<div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
</div>
<div class="calendar" id="calendar"></div>

<div class="period-section">
<div class="period-key"><i></i>チケット受付期間（カレンダー内のオレンジ色のバーを押すと詳細を表示）</div>
</div>

<div class="legend" id="legend"></div>
<p class="small">日付を選ぶと、その日のイベントと、その日が受付期間に含まれるチケットが表示されます。オレンジ色のバーは受付開始日から終了日までを示します。</p>
</section>

<aside class="panel">
<h2 id="dayTitle">選択日の予定</h2>
<div id="dayEvents" class="cards"></div>
<hr style="border:0;border-top:1px solid var(--line);margin:15px 0">
<h2>公式データ更新</h2>
<div id="status" class="status warn">更新情報を確認中…</div>
<div class="actions">
<button class="primary" id="refresh" type="button">公式データを再読込</button>
<button id="backup" type="button">バックアップ</button>
<button id="restore" type="button">復元</button>
<input type="file" id="file" accept="application/json" hidden>
</div>
<p class="muted">公式予定はGitHub Actionsで取得します。再読込は公開済みのJSONを読み直します。手動予定はこのブラウザ内に保存されます。</p>

<label>メンバーで絞り込み
<select id="memberFilter">
<option value="">全員</option>
<option>辻本達規</option><option>田村侑久</option><option>本田剛文</option>
<option>平松賢人</option><option>吉原雅斗</option>
<option>グループ全体</option><option>その他</option>
</select>
</label>

<label>種類で絞り込み
<select id="typeFilter">
<option value="">すべて</option>
<option>イベント</option><option>ライブ</option><option>リリース</option>
<option>テレビ</option><option>ラジオ</option><option>舞台</option>
<option>配信</option><option>特典会</option><option>チケット受付</option><option>その他</option>
</select>
</label>
</aside>

<section class="panel" id="editor" style="display:none">
<div class="toolbar">
<h2 id="editorTitle">予定追加</h2>
<button id="close" type="button">閉じる</button>
</div>
<form id="form">
<input id="id" type="hidden">
<input id="origin" type="hidden">
<div class="formrow">
<label>日付<input id="date" type="date" required></label>
<label>時刻<input id="time" type="text" placeholder="例 13:00 / 未定"></label>
</div>
<label>イベント名<input id="title" required maxlength="180"></label>
<div class="formrow">
<label>出演者
<select id="member">
<option>グループ全体</option><option>辻本達規</option><option>田村侑久</option>
<option>本田剛文</option><option>平松賢人</option><option>吉原雅斗</option><option>その他</option>
</select>
</label>
<label>種類
<select id="type">
<option>イベント</option><option>ライブ</option><option>リリース</option>
<option>テレビ</option><option>ラジオ</option><option>舞台</option>
<option>配信</option><option>特典会</option><option>チケット受付</option><option>その他</option>
</select>
</label>
</div>
<label>会場<input id="place" placeholder="例 Zepp Nagoya"></label>
<label>出典URL<input id="url" type="url" placeholder="https://..."></label>
<label>メモ<textarea id="notes" placeholder="受付期間、衣装、注意事項など"></textarea></label>
<div id="periodFields" class="hidden">
<div class="formrow">
<label>受付開始日<input id="startDate" type="date"></label>
<label>受付終了日<input id="endDate" type="date"></label>
</div>
<p class="small">チケット受付期間を設定すると、カレンダー上に横長バーを表示します。</p>
</div>
<label style="display:flex;align-items:center;gap:7px">
<input id="unconfirmed" type="checkbox">未確認情報
</label>
<div class="actions">
<button class="primary" type="submit">保存</button>
<button type="button" id="cancel">キャンセル</button>
</div>
</form>
</section>
</main>

<script>
"use strict";

const COLORS={
 "辻本達規":"#e65353",
 "田村侑久":"#3d8bc9",
 "本田剛文":"#e68cae",
 "平松賢人":"#d6a62c",
 "吉原雅斗":"#4d9b67",
 "グループ全体":"#7b6bc2",
 "その他":"#999"
};
const KEY="boimenCalendarManualV3";
let official=[];
let manual=readManual();
let month=new Date();
let selected=key(new Date());
let busy=false;

const $=id=>document.getElementById(id);

function key(d){
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function cleanList(data){
 return Array.isArray(data)
  ? data.filter(x=>x&&typeof x==="object"&&typeof x.id==="string")
  : [];
}
function readManual(){
 try{return cleanList(JSON.parse(localStorage.getItem(KEY)||"[]"));}
 catch{return [];}
}
function saveManual(){
 try{localStorage.setItem(KEY,JSON.stringify(manual));}
 catch{alert("ブラウザに保存できませんでした。バックアップを取ってください。");}
}
function esc(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function safeUrl(u){
 try{
  const p=new URL(u,location.href);
  return (p.protocol==="https:"||p.protocol==="http:")?p.href:"";
 }catch{return "";}
}
function all(){
 const hidden=new Set(manual.filter(x=>x.hidden).map(x=>x.id));
 const replacements=new Set(manual.filter(x=>!x.hidden).map(x=>x.id));
 return [
  ...official.filter(x=>!hidden.has(x.id)&&!replacements.has(x.id)),
  ...manual.filter(x=>!x.hidden)
 ];
}
function isPeriod(e){
 return e.period_type==="ticket" && !!(e.start_date||e.date) && !!(e.end_date||e.date);
}
function periodStart(e){return e.start_date||e.date;}
function periodEnd(e){return e.end_date||e.date;}
function filtered(e){
 const m=$("memberFilter").value, t=$("typeFilter").value;
 return (!m||e.member===m||isPeriod(e))&&(!t||e.type===t);
}
function mapUrl(place){
 return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(place);
}
function mapLink(place){
 if(!place)return "";
 return `<a class="map-link" href="${mapUrl(place)}" target="_blank" rel="noopener noreferrer">${esc(place)}（Googleマップ ↗）</a>`;
}
function dateLabel(value){
 if(!value)return "";
 const d=new Date(value+"T12:00:00");
 if(Number.isNaN(d.getTime()))return value;
 return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}
function eventColor(e){return COLORS[e.member]||"#999";}

function render(){
 $("month").textContent=month.getFullYear()+"年 "+(month.getMonth()+1)+"月";

 const first=new Date(month.getFullYear(),month.getMonth(),1);
 const start=new Date(first);
 start.setDate(1-first.getDay());
 const today=key(new Date());
 const periodEvents=all().filter(e=>isPeriod(e)&&filtered(e));
 let out="";

 for(let week=0;week<6;week++){
  const weekStart=new Date(start);
  weekStart.setDate(start.getDate()+week*7);
  const weekEnd=new Date(weekStart);
  weekEnd.setDate(weekStart.getDate()+6);
  let daysHtml="";

  for(let day=0;day<7;day++){
   const d=new Date(weekStart);
   d.setDate(weekStart.getDate()+day);
   const k=key(d);
   const ev=all()
    .filter(x=>!isPeriod(x)&&x.date===k&&filtered(x))
    .sort((a,b)=>(a.time||"").localeCompare(b.time||""));

   daysHtml+=`<button type="button" class="day ${d.getMonth()!==month.getMonth()?"outside":""} ${k===today?"today":""} ${k===selected?"selected":""}" data-date="${k}">
    <span class="daynum">${d.getDate()}</span>
    ${ev.slice(0,3).map(x=>`<span class="pill" style="background:${eventColor(x)}35;border-left:3px solid ${eventColor(x)}" title="${esc(x.title)}">${esc(x.title)}</span>`).join("")}
    ${ev.length>3?`<span class="small">ほか${ev.length-3}件</span>`:""}
   </button>`;
  }

  const lanes=[];
  const bars=[];
  for(const e of periodEvents){
   const s=new Date(periodStart(e)+"T12:00:00");
   const en=new Date(periodEnd(e)+"T12:00:00");
   if(Number.isNaN(s.getTime())||Number.isNaN(en.getTime()))continue;
   if(en<weekStart||s>weekEnd)continue;
   const startCol=Math.max(0,Math.round((s-weekStart)/86400000));
   const endCol=Math.min(7,Math.round((en-weekStart)/86400000)+1);
   if(endCol<=startCol)continue;
   let lane=0;
   while(lanes[lane]!==undefined&&lanes[lane]>startCol)lane++;
   lanes[lane]=endCol;
   const label=e.title||"チケット受付";
   bars.push(`<button type="button" class="period-bar" style="--start:${startCol+1};--end:${endCol+1};--lane:${lane+1}" data-period-id="${esc(e.id)}" title="${esc(label)}&#10;${esc(periodStart(e))} ～ ${esc(periodEnd(e))}">${esc(label)}</button>`);
  }
  const rowCount=lanes.length;
  const ticketHtml=rowCount?`<div class="week-ticket-lane" style="grid-template-rows:repeat(${rowCount},minmax(23px,auto))">${bars.join("")}</div>`:"";
  out+=`<div class="week-row"><div class="week-days">${daysHtml}</div>${ticketHtml}</div>`;
 }
 $("calendar").innerHTML=out;

 $("legend").innerHTML=Object.entries(COLORS)
  .map(([name,color])=>`<span><i class="dot" style="background:${color}"></i>${esc(name)}</span>`)
  .join("");

 document.querySelectorAll("[data-date]").forEach(button=>{
  button.onclick=()=>{
   selected=button.dataset.date;
   const d=new Date(selected+"T12:00:00");
   if(d.getMonth()!==month.getMonth())month=d;
   render();
  };
 });
 document.querySelectorAll("[data-period-id]").forEach(button=>{
  button.onclick=()=>{
   const e=all().find(x=>x.id===button.dataset.periodId);
   if(!e)return;
   selected=periodStart(e);
   month=new Date(selected+"T12:00:00");
   render();
   showPeriodDetail(e);
  };
 });
 renderDay();
}

function periodCard(e){
 return `
  <article class="event">
   <h3>${esc(e.title)}</h3>
   <div class="meta">受付期間：${esc(dateLabel(periodStart(e)))} ～ ${esc(dateLabel(periodEnd(e)))}</div>
   ${e.notes?`<p class="muted">${esc(e.notes).replace(/\n/g,"<br>")}</p>`:""}
   ${safeUrl(e.url)?`<p><a href="${esc(safeUrl(e.url))}" target="_blank" rel="noopener noreferrer">公式・出典ページ ↗</a></p>`:""}
   ${e.place?`<p class="meta">📍 ${mapLink(e.place)}</p>`:""}
   <div class="actions"><button type="button" data-edit="${esc(e.id)}">編集</button></div>
  </article>`;
}

function bindEditButtons(){
 document.querySelectorAll("[data-edit]").forEach(button=>{
  button.onclick=()=>{
   const e=all().find(x=>x.id===button.dataset.edit);
   if(e)edit(e);
  };
 });
}

function showPeriodDetail(e){
 $("dayTitle").textContent="チケット受付期間";
 $("dayEvents").innerHTML=periodCard(e);
 bindEditButtons();
}

function renderDay(){
 const d=new Date(selected+"T12:00:00");
 $("dayTitle").textContent=(d.getMonth()+1)+"月"+d.getDate()+"日の予定";

 const list=all()
  .filter(x=>!isPeriod(x)&&x.date===selected&&filtered(x))
  .sort((a,b)=>(a.time||"").localeCompare(b.time||""));

 $("dayEvents").innerHTML=list.length?list.map(e=>`
  <article class="event">
   <h3><i class="dot" style="background:${eventColor(e)}"></i> ${esc(e.title)}</h3>
   <div class="meta">${esc(e.time||"時刻未定")} · ${esc(e.member||"")} · ${esc(e.type||"イベント")}</div>
   ${e.place?`<div class="meta">📍 ${mapLink(e.place)}</div>`:`<div class="meta">📍 会場未取得 · <a href="${mapUrl(e.title)}" target="_blank" rel="noopener noreferrer">タイトルで地図検索 ↗</a></div>`}
   <span class="chip">${e.origin==="official"?"公式取得":e.source==="dera"?"でらボ公式":e.source==="boys"?"BOYS AND MEN公式":"手動登録"}</span>
   ${e.unconfirmed?'<span class="chip">未確認</span>':""}
   ${e.notes?`<p class="muted">${esc(e.notes).replace(/\n/g,"<br>")}</p>`:""}
   ${safeUrl(e.url)?`<p><a href="${esc(safeUrl(e.url))}" target="_blank" rel="noopener noreferrer">公式・出典ページ ↗</a></p>`:""}
   <div class="actions"><button type="button" data-edit="${esc(e.id)}">編集</button><button class="danger" type="button" data-del="${esc(e.id)}">削除</button></div>
  </article>`).join(""):'<p class="muted">この日の予定はまだありません。公式データを再読込するか、手動で追加してね。</p>';

 // この日が受付期間に含まれるチケットも表示
 const periods=all().filter(e=>isPeriod(e)&&filtered(e)&&periodStart(e)<=selected&&selected<=periodEnd(e));
 if(periods.length){
  $("dayEvents").insertAdjacentHTML("beforeend",
   `<div class="period-heading">この日が受付期間のチケット（${periods.length}件）</div>`+
   periods.map(periodCard).join(""));
 }

 bindEditButtons();
 document.querySelectorAll("[data-del]").forEach(button=>{
  button.onclick=()=>{
   const e=all().find(x=>x.id===button.dataset.del);
   if(!e)return;
   if(!confirm("「"+e.title+"」を削除する？"))return;

   if(e.origin==="official"){
    manual=manual.filter(x=>x.id!==e.id);
    manual.push({...e,hidden:true});
   }else{
    manual=manual.filter(x=>x.id!==e.id);
   }
   saveManual();
   render();
  };
 });
}

async function refresh(){
 if(busy)return;
 busy=true;
 $("refresh").disabled=true;
 $("status").className="status warn";
 $("status").textContent="最新の公式データを読み込み中…";

 try{
  const response=await fetch("./data/events.json?ts="+Date.now(),{cache:"no-store"});
  if(!response.ok)throw Error("HTTP "+response.status);

  const data=await response.json();
  official=Array.isArray(data.events)?data.events:[];

  const sourceSummary=Object.entries(data.sources||{})
   .map(([name,value])=>`${esc(name)} ${Number(value.count)||0}件`)
   .join(" / ");

  const places=official.filter(e=>e.place).length;
  const periods=official.filter(isPeriod).length;

  $("status").className="status ok";
  $("status").innerHTML=
   `公式データを読み込みました。<br>`+
   `取得イベント：${official.length}件<br>`+
   `会場情報あり：${places}件<br>`+
   `チケット受付期間：${periods}件<br>`+
   `最終取得：${esc(data.updated_at||"不明")}<br>`+
   `情報源：${sourceSummary||"記録なし"}`;

  render();
 }catch(error){
  $("status").className="status warn";
  $("status").textContent="公開データを取得できませんでした（"+error.message+"）。GitHub Actionsとdata/events.jsonを確認してね。";
 }finally{
  busy=false;
  $("refresh").disabled=false;
 }
}

function edit(e){
 $("editor").style.display="block";
 $("editorTitle").textContent=e?"予定を編集":"予定を追加";

 $("id").value=e?.id||"";
 $("origin").value=e?.origin||"";
 $("date").value=e?.date||selected;
 $("time").value=e?.time||"";
 $("title").value=e?.title||"";
 $("member").value=e?.member||"グループ全体";
 $("type").value=e?.type||"イベント";
 $("place").value=e?.place||"";
 $("url").value=e?.url||"";
 $("notes").value=e?.notes||"";
 $("unconfirmed").checked=!!e?.unconfirmed;

 $("startDate").value=e?.start_date||"";
 $("endDate").value=e?.end_date||"";
 $("periodFields").classList.toggle("hidden",$("type").value!=="チケット受付");

 $("editor").scrollIntoView({behavior:"smooth",block:"start"});
}

function closeEditor(){
 $("editor").style.display="none";
 $("form").reset();
 $("periodFields").classList.add("hidden");
}

$("type").addEventListener("change",()=>{
 $("periodFields").classList.toggle("hidden",$("type").value!=="チケット受付");
});

$("form").onsubmit=event=>{
 event.preventDefault();

 const oldId=$("id").value;
 const old=oldId?all().find(x=>x.id===oldId):null;
 const isTicket=$("type").value==="チケット受付";
 const startDate=isTicket?($("startDate").value||$("date").value):"";
 const endDate=isTicket?($("endDate").value||startDate):"";

 if(isTicket&&(!startDate||!endDate||endDate<startDate)){
  alert("受付開始日と終了日を正しく入力してね。");
  return;
 }

 const id=oldId||"manual-"+Date.now();
 const item={
  id,
  date:isTicket?startDate:$("date").value,
  time:$("time").value.trim(),
  title:$("title").value.trim(),
  member:$("member").value,
  type:$("type").value,
  place:$("place").value.trim(),
  url:$("url").value.trim(),
  notes:$("notes").value.trim(),
  unconfirmed:$("unconfirmed").checked,
  source:old?.source||"manual",
  origin:"manual"
 };

 if(isTicket){
  item.period_type="ticket";
  item.start_date=startDate;
  item.end_date=endDate;
 }else if(old&&old.period_type==="ticket"){
  item.period_type="ticket";
  item.start_date=old.start_date;
  item.end_date=old.end_date;
 }

 manual=manual.filter(x=>x.id!==id);
 manual.push(item);
 saveManual();

 selected=item.date;
 month=new Date(item.date+"T12:00:00");
 closeEditor();
 render();
};

$("prev").onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);render();};
$("next").onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);render();};
$("today").onclick=()=>{month=new Date();selected=key(new Date());render();};
$("add").onclick=()=>edit(null);
$("close").onclick=closeEditor;
$("cancel").onclick=closeEditor;
$("refresh").onclick=refresh;
$("memberFilter").onchange=render;
$("typeFilter").onchange=render;

$("backup").onclick=()=>{
 const blob=new Blob([JSON.stringify(manual,null,2)],{type:"application/json"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="boimen-calendar-manual-backup.json";
 a.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
};

$("restore").onclick=()=>$("file").click();

$("file").onchange=async event=>{
 try{
  const file=event.target.files[0];
  if(!file)return;
  const data=JSON.parse(await file.text());
  if(!Array.isArray(data))throw Error("配列ではありません");
  if(confirm("手動予定をバックアップの内容で置き換える？")){
   manual=cleanList(data);
   saveManual();
   render();
  }
 }catch{
  alert("バックアップファイルを読み込めませんでした。");
 }finally{
  event.target.value="";
 }
};

render();
refresh();
setInterval(refresh,30*60*1000);
</script>
</body>
</html>
